name: Release

# Jalan otomatis setiap kali kamu push tag berawalan "v", contoh: v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  web:
    name: Paket web (zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tulis nomor versi ke game
        run: sed -i "s/__VERSION__/${GITHUB_REF_NAME}/" www/index.html

      - name: Buat zip
        run: |
          cd www
          zip -r "../tambang-emas-idle-web-${GITHUB_REF_NAME}.zip" .

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tambang-emas-idle-web-${{ github.ref_name }}.zip
          generate_release_notes: true

  android:
    name: Android (APK + AAB rilis)
    runs-on: ubuntu-latest
    needs: web          # tunggu release dibuat dulu agar tidak balapan
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Cek secret penandatanganan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v belum dibuat. Lihat README bagian 'Menandatangani aplikasi'."; missing=1; fi
          done
          exit $missing

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

      - name: Hitung versi dari tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            CODE=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
          else
            CODE="$GITHUB_RUN_NUMBER"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$TAG versionCode=$CODE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tulis nomor versi ke game
        run: sed -i "s/__VERSION__/${GITHUB_REF_NAME}/" www/index.html

      - name: Install dependensi
        run: npm install

      - name: Buat proyek Android
        run: npx cap add android

      - name: Buat ikon & splash screen
        run: npx capacitor-assets generate --android

      - name: Sinkronkan web ke Android
        run: npx cap sync android

      - name: Atur tanda tangan & versi
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: python3 scripts/patch-android.py

      - name: Build APK + AAB rilis
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verifikasi tanda tangan APK
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Ganti nama file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "tambang-emas-idle-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "tambang-emas-idle-${GITHUB_REF_NAME}.aab"

      - name: Upload ke Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tambang-emas-idle-${{ github.ref_name }}.apk
            tambang-emas-idle-${{ github.ref_name }}.aab
